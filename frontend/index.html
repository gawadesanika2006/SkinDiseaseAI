<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinNova AI | Smart Skin Analysis</title>
    <style>
        body {
            background-color: #0e1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            color: #58a6ff;
            margin-bottom: 10px;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .upload-box {
            border: 2px dashed #30363d;
            padding: 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 20px;
            background: #0d1117;
        }
        .upload-box:hover {
            border-color: #58a6ff;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: #238636;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            margin-top: 10px;
        }
        .upload-btn:hover {
            background-color: #2ea043;
        }
        #preview-container {
            margin-top: 20px;
            display: none;
        }
        #preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .analyze-btn {
            background-color: #1f6feb;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }
        .analyze-btn:hover {
            background-color: #388bfd;
        }
        #result-box {
            margin-top: 25px;
            text-align: left;
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✚ SkinNova AI</h2>
        <p>Understand your skin better using Digital Image Processing and Deep Learning.</p>

        <div class="upload-box" onclick="document.getElementById('file-input').click()">
            <p>📁 Drag & drop skin image here, or click to browse</p>
            <label class="upload-btn">Choose Image</label>
            <input type="file" id="file-input" accept="image/*" onchange="previewImage(event)">
        </div>

        <div id="preview-container">
            <img id="preview-img" src="" alt="Selected Preview">
            <br>
            <button class="analyze-btn" id="analyze-btn" onclick="analyzeImage()">✦ Analyze Image</button>
        </div>

        <div id="result-box">
            <h3 style="color: #58a6ff; margin-top: 0;">📊 Analysis Result</h3>
            <p id="result-text">Processing...</p>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview-img').src = e.target.result;
                    document.getElementById('preview-container').style.display = 'block';
                    document.getElementById('analyze-btn').style.display = 'block';
                    document.getElementById('result-box').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        function analyzeImage() {
            const resultBox = document.getElementById('result-box');
            const resultText = document.getElementById('result-text');
            resultBox.style.display = 'block';
            resultText.innerHTML = "<b>AI is analyzing your skin image...</b><br>Please ensure connection to model backend.";
            
            // Simulation or direct integration can be wired here
            setTimeout(() => {
                resultText.innerHTML = "<b>Prediction:</b> Sample Analysis Completed.<br><i>Note: Connect via Streamlit python handlers for live PyTorch inference.</i>";
            }, 1500);
        }
    </script>
</body>
</html>
